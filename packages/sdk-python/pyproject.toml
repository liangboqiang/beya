[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beya-sdk"
version = "0.1.0"
description = "Python client SDK for the Beya Gateway API"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
beya = "beya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
