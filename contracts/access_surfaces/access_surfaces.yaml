# 接入面：所有用户入口和外部调用入口。

id: access_surfaces
name: 接入面
level: top
layer_order: 1
canonical_role: 只负责输入输出体验，把用户或外部系统请求转换成统一协议。

current_paths:
  - desktop/src
  - src/main.tsx
  - src/entrypoints
  - adapters
  - packages/sdk-python

target_children:
  - desktop_app
  - cli_shell
  - h5_client
  - im_adapters
  - product_sdk

owns:
  - 用户输入采集
  - 用户可见状态展示
  - 本地 UI 偏好
  - 入口级错误展示
  - 外部调用者协议适配

input_contracts:
  - user_action
  - cli_args
  - im_event
  - sdk_call

output_contracts:
  - app_ws
  - app_rpc
  - session_ws

allowed_dependencies:
  - protocol_gateway
  - foundation

forbidden_dependencies:
  - session_host
  - agent_core
  - capability_registry
  - model_runtime

must_not_own:
  - agent 推理循环
  - provider 选择和鉴权
  - session runtime 生命周期
  - ~/.beya 业务持久化写入

integration_rules:
  - 应用级资源和控制请求必须使用 app_ws/app_rpc。
  - HTTP 只保留静态资源、OAuth callback、provider proxy、文件预览和浏览器原生资源。
  - 所有远程会话通信都走 session_ws canonical 路径。
  - UI 只消费协议事件，不解释 agent 内部事件。
  - IM Adapter 不能保留私有 WebSocket 语义。

retire_or_absorb:
  - direct_business_state_write
  - legacy_im_ws_path
  - duplicated_chat_message_types

validation_focus:
  - Desktop、SDK、Adapter 使用同源 session_ws 类型。
  - 入口层不直接 import server runtime 或 agent core。
