# Agent 内核：一次 agent turn 的纯语义内核。

id: agent_core
name: Agent 内核
level: top
layer_order: 4
canonical_role: 负责上下文、模型请求、工具编排、权限决策、transcript 事件和 subagent 编排。

current_paths:
  - src/QueryEngine.ts
  - src/query.ts
  - src/query
  - src/Tool.ts
  - src/services/tools
  - src/tools/AgentTool
  - src/utils/messages.ts

target_children:
  - message_model
  - prompt_context
  - turn_loop
  - tool_orchestration
  - permission_flow
  - subagent_orchestration
  - transcript_events

owns:
  - 模型上下文组装
  - 工具调用顺序
  - permission request/response 语义
  - agent 内部事件
  - transcript 语义

input_contracts:
  - agent_turn
  - runtime_process
  - provider_runtime
  - capability_manifest

output_contracts:
  - model_request
  - tool_use_request
  - permission_request
  - transcript_event

allowed_dependencies:
  - capability_registry
  - model_runtime
  - foundation

forbidden_dependencies:
  - access_surfaces
  - protocol_gateway
  - session_host

must_not_own:
  - Desktop/Ink 渲染
  - HTTP/WS 连接
  - provider 存储
  - session 进程生命周期

integration_rules:
  - Tool runtime contract 与 presentation contract 必须拆开。
  - AgentTool 和 subagent 编排属于 agent_core，不作为普通工具争权。
  - UI 只能消费 agent 事件，不能进入 turn loop。

retire_or_absorb:
  - tool_ui_fields_inside_runtime_contract
  - agent_tool_as_regular_registry_tool
  - query_importing_ui_components

validation_focus:
  - agent-loop、tool execution、permission 使用 mock/fixture 测试。
  - agent_core 不 import src/components、desktop 或 server/ws。
