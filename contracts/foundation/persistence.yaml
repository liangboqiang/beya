# Persistence 协议。
# 所有用户拥有状态必须声明 owner、迁移和未知字段策略。

id: persistence
owner_module: foundation

user_owned_rules:
  preserve_unknown_fields: true
  write_schema_version_to_global_settings: false
  backup_before_repair: true

stores:
  - id: user_settings
    paths:
      - "~/.beya/settings.json"
      - "~/.claude/settings.json"
    owner: foundation
  - id: provider_index
    paths:
      - "~/.beya/beya/providers.json"
      - "~/.beya/beya/settings.json"
    owner: model_runtime
  - id: sessions
    paths:
      - "~/.beya/projects/**/*.jsonl"
      - "~/.claude/projects/**/*.jsonl"
    owner: session_host
  - id: adapter_config
    paths:
      - "~/.claude/adapters.json"
      - "~/.claude/adapter-sessions.json"
    owner: access_surfaces
  - id: skills_plugins_mcp
    paths:
      - "~/.claude/skills"
      - ".mcp.json"
      - "~/.claude/plugins/**"
    owner: capability_registry
