# Compatibility 协议。
# 兼容入口必须集中声明，不能散落在业务代码里。

id: compatibility
owner_module: foundation

aliases:
  - id: legacy_claude_config_dir
    from: CLAUDE_CONFIG_DIR
    to: BEYA_CONFIG_DIR
    owner: foundation
    removal_condition: external_launchers_stop_setting_legacy_env
  - id: legacy_claude_app_root
    from: CLAUDE_APP_ROOT
    to: BEYA_APP_ROOT
    owner: foundation
    removal_condition: sidecar_and_packaging_use_beya_env
  - id: noop_shims
    owner: foundation
    files:
      - src/server/sessionManager.ts
      - src/utils/taskSummary.ts
      - src/entrypoints/sdk/sdkUtilityTypes.ts
    removal_condition: no_importers_left
