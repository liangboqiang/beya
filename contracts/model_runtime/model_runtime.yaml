# 模型运行时：provider 和 local CLI 的统一能力层。

id: model_runtime
name: 模型运行时
level: top
layer_order: 6
canonical_role: 通过 RuntimeProfile 统一 provider、local CLI、模型目录、代理转换和 usage 解释。

current_paths:
  - src/server/runtime
  - src/server/services/providerService.ts
  - src/server/services/localCliRuntimeService.ts
  - src/server/proxy
  - src/services/api
  - src/utils/model

target_children:
  - runtime_profile
  - provider_storage
  - model_catalog
  - proxy_transform
  - local_cli_runtime
  - usage_context_telemetry

owns:
  - provider/local CLI 能力
  - 模型选择和校验
  - 上游 API 格式转换
  - token/context usage 解释
  - provider 存储和鉴权材料读取

input_contracts:
  - provider_runtime
  - provider_config
  - local_cli_config

output_contracts:
  - runtime_profile
  - model_catalog
  - proxy_request
  - usage_context

allowed_dependencies:
  - foundation

forbidden_dependencies:
  - access_surfaces
  - protocol_gateway
  - session_host
  - agent_core
  - capability_registry

must_not_own:
  - session WebSocket
  - UI 设置页状态
  - agent tool registry
  - permission UI

integration_rules:
  - provider 和 local CLI 能力都只通过 RuntimeProfile 暴露。
  - proxy transform 只属于 model_runtime。
  - session_host 可以选择 runtime，但不能解释 provider 细节。

retire_or_absorb:
  - provider_capability_checks_outside_runtime_profile
  - proxy_transform_inside_server_route
  - model_usage_parsing_inside_agent_loop

validation_focus:
  - provider/runtime 单测覆盖 RuntimeProfile 和 proxy transform。
  - model_runtime 不 import agent_core、session_host 或 UI。
