# Provider Runtime 协议。
# provider 和 local CLI 都通过 RuntimeProfile 暴露能力。

id: provider_runtime
owner_module: model_runtime
source_type: RuntimeProfile

required_fields:
  - id
  - kind
  - displayName
  - defaultModelId
  - models
  - capabilities

capability_fields:
  - streaming
  - tools
  - contextUsage
  - tokenUsage
  - prewarm
  - resume
  - vision
  - thinking
  - promptInput

usage_sources:
  - provider
  - local_cli
  - transcript_estimate
  - none

boundary_rules:
  - session_host 可以选择 runtime profile，但不能解释 provider 细节。
  - agent_core 只能读取能力，不直接读取 provider 存储。
  - proxy transform 只属于 model_runtime。
