# App 资源 RPC 协议。
# 资源请求承载在 /ws/app 消息内，不开放 HTTP /api/*。

id: app_rpc
owner_module: protocol_gateway
transport: app_ws

message_type: api_request

path_rules:
  canonical_form: /{resource}
  examples:
    - /health
    - /sessions
    - /providers/catalog
    - /plugins/reload
  forbidden_prefixes:
    - /api
    - /ws
    - /sdk
    - /proxy
    - /local-file
    - /preview-fs
    - /open-target-icons

resource_groups:
  - id: system
    paths:
      - /health
      - /readiness
      - /status
  - id: session
    paths:
      - /sessions
      - /conversations
      - /teams
  - id: runtime
    paths:
      - /providers
      - /models
      - /effort
      - /local-cli
  - id: capability
    paths:
      - /tools
      - /plugins
      - /skills
      - /mcp
      - /agents
  - id: workspace
    paths:
      - /filesystem
      - /search
      - /memory
      - /open-targets
  - id: desktop_ops
    paths:
      - /desktop-ui
      - /adapters
      - /h5-access
      - /doctor
      - /diagnostics
  - id: automation
    paths:
      - /tasks
      - /scheduled-tasks
      - /activity-stats

http_survivors:
  - 静态 H5 和资源文件
  - /health 与 /readiness 探活
  - OAuth callback
  - provider proxy
  - 文件预览、下载和浏览器原生能力
  - /open-target-icons/* 这种浏览器图片资源
