# Session WebSocket 协议。
# Desktop、H5、IM Adapter、SDK 都应使用这套消息语义。

id: session_ws
owner_module: protocol_gateway
canonical_path: /ws/{sessionId}
internal_sdk_path: /sdk/{sessionId}

client_to_server_groups:
  - lifecycle
  - user_input
  - permission
  - runtime_config
  - interruption
  - heartbeat
  - computer_use

server_to_client_groups:
  - lifecycle
  - streaming
  - tool
  - permission
  - completion
  - status
  - operations

required_fields:
  client_message:
    - type
  server_message:
    - type
    - sessionId_when_applicable

boundary_rules:
  - protocol_gateway 只负责连接、认证、反序列化和转发。
  - session 语义交给 session_host。
  - agent 事件解释不能写在 transport 代码里。
  - user_message、stop_generation、permission_response、set_runtime_config 只能属于 session_ws。
  - 应用资源 RPC 属于 app_ws，不能混入 session realtime stream。
  - 实时通道不放进 /api 资源树，避免 REST 资源和 WebSocket 通道混名。
