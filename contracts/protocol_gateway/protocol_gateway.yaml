# 协议网关：产品对外协议的唯一入口。

id: protocol_gateway
name: 协议网关
level: top
layer_order: 2
canonical_role: 只负责 HTTP、WebSocket、认证、CORS、静态 H5 和协议错误映射。

current_paths:
  - src/server/index.ts
  - src/server/router.ts
  - src/server/api
  - src/server/ws
  - src/server/middleware
  - src/server/staticH5.ts

target_children:
  - http_router
  - session_ws_transport
  - auth_and_cors
  - h5_static_entry
  - request_error_mapping

owns:
  - 统一路径命名
  - 请求认证
  - transport lifecycle
  - 协议级错误格式

input_contracts:
  - http_api
  - route_naming
  - session_ws

output_contracts:
  - session_command
  - session_event_stream

allowed_dependencies:
  - session_host
  - foundation

forbidden_dependencies:
  - access_surfaces
  - agent_core
  - capability_registry
  - model_runtime

must_not_own:
  - session runtime 状态机
  - provider 请求转换
  - tool 执行
  - agent 事件语义

integration_rules:
  - 外部 HTTP 只允许 /api/*。
  - 外部 WebSocket 统一使用 /ws/{sessionId}。

retire_or_absorb:
  - top_level_health_alias
  - api_v1_or_openai_proxy_public_path

validation_focus:
  - server contract 测试保护 canonical 路径。
  - 网关代码不直接 import provider、tool 或 UI 实现。
