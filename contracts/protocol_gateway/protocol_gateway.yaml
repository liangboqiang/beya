# 协议网关：产品对外协议的唯一入口。

id: protocol_gateway
name: 协议网关
level: top
layer_order: 2
canonical_role: 只负责 WebSocket、必要 HTTP 原生能力、认证、CORS、静态 H5 和协议错误映射。

current_paths:
  - src/server/index.ts
  - src/server/router.ts
  - src/server/api
  - src/server/ws
  - src/server/middleware
  - src/server/staticH5.ts

target_children:
  - app_ws_control
  - app_resource_rpc
  - session_ws_transport
  - auth_and_cors
  - h5_static_entry
  - request_error_mapping

owns:
  - 统一路径命名
  - 请求认证
  - transport lifecycle
  - 协议级错误格式

input_contracts:
  - app_ws
  - app_rpc
  - route_naming
  - session_ws

output_contracts:
  - session_command
  - session_event_stream

allowed_dependencies:
  - session_host
  - foundation

forbidden_dependencies:
  - access_surfaces
  - agent_core
  - capability_registry
  - model_runtime

must_not_own:
  - session runtime 状态机
  - provider 请求转换
  - tool 执行
  - agent 事件语义

integration_rules:
  - 应用级 WebSocket 控制面统一使用 /ws/app。
  - 应用资源请求只能作为 app_ws 消息承载，资源路径不能带 /api 前缀。
  - 会话级 WebSocket 实时面统一使用 /ws/{sessionId}。
  - session_ws 只能承载会话命令和会话事件，不能承载应用资源 RPC。

retire_or_absorb:
  - legacy_http_resource_route
  - api_v1_or_openai_proxy_public_path

validation_focus:
  - server contract 测试保护 canonical 路径。
  - 网关代码不直接 import provider、tool 或 UI 实现。
